pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'playtivity-native'

def coreDir = file(System.getenv("ANDROID_CORE_DIR") ?: "../../android-core")
if (!coreDir.exists()) {
    throw new GradleException("android-core not found at ${coreDir}. Check it out beside this repository or set ANDROID_CORE_DIR.")
}
includeBuild(coreDir) {
    dependencySubstitution {
        substitute module("com.mliem.android:update") using project(":update")
    }
}

include ':core'
include ':app'
