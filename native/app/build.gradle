plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def versionText = file('../../version.yml').text.readLines().find { it.startsWith('version:') }?.substring('version:'.length())?.trim()
if (!versionText || !versionText.matches(/[A-Za-z0-9.+-]+/)) {
    throw new GradleException('version.yml must contain version: NAME+BUILD')
}
def versionParts = versionText.split('\\+')
if (versionParts.length != 2 || !versionParts[1].matches(/\d+/)) {
    throw new GradleException('version.yml must contain version: NAME+BUILD')
}
def buildCode = versionParts[1].toLong()
// ponytail: Unix seconds reach Android's code limit in 2036; use a persisted release sequence before then.
def androidCode = versionParts[0].contains('-nightly-') ? buildCode : Math.max(buildCode, System.currentTimeMillis().intdiv(1000))
if (androidCode > 2100000000L) {
    throw new GradleException('Android version code exceeds the supported range')
}
def signingVariables = ['ANDROID_KEYSTORE_PATH', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
def releaseSigningReady = signingVariables.every { System.getenv(it) }

kotlin {
    jvmToolchain(21)
}

android {
    namespace 'com.mliem.playtivity.nativeapp'
    compileSdk 37

    defaultConfig {
        applicationId 'com.mliem.playtivity'
        minSdk 26
        targetSdk 36
        versionCode androidCode.toInteger()
        versionName versionParts[0]
    }

    flavorDimensions 'distribution'
    productFlavors {
        preview {
            dimension 'distribution'
            applicationIdSuffix '.nativeapp'
            resValue 'string', 'app_name', 'Playtivity Preview'
        }
        production {
            dimension 'distribution'
            resValue 'string', 'app_name', 'Playtivity'
        }
    }

    signingConfigs {
        productionRelease {
            if (releaseSigningReady) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningReady) signingConfig signingConfigs.productionRelease
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        compose true
        resValues true
    }
}

dependencies {
    implementation project(':core')
    implementation 'com.mliem.android:update:1.0.0'
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.1'
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
}
